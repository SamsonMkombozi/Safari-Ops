{% extends base_template %}
{% block content %}
<div class="admin-card" style="max-width:520px">
  <div class="admin-card-body">
    {% if success %}<div class="admin-alert admin-alert--success">Password changed.</div>{% endif %}
    {% if error %}<div class="admin-alert admin-alert--error">{{ error }}</div>{% endif %}
    <form method="post">{% csrf_token %}{% include "partials/form_fields.html" %}<button class="admin-btn admin-btn--primary" style="margin-top:1rem">Change password</button>
      <a href="{% url 'accounts:profile' %}" class="admin-btn admin-btn--muted" style="margin-top:1rem">Back</a></form>
  </div>
</div>
{% endblock %}
