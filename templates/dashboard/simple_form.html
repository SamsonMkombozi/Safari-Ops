{% extends "dashboard/_base.html" %}
{% load ui %}
{% block content %}
<div class="admin-card" style="max-width:980px">
  <div class="admin-card-header">
    <h3>{{ page_title }}</h3>
    {% if back %}<a href="{{ back }}" class="admin-btn admin-btn--outline">← Back</a>{% endif %}
  </div>
  <div class="admin-card-body">
    {% if intro %}<p class="muted" style="margin-bottom:1rem;font-size:.8rem">{{ intro }}</p>{% endif %}
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div style="display:flex;gap:.5rem;margin-top:1rem">
        <button type="submit" class="admin-btn admin-btn--primary">{% icon 'check' 13 %} Save</button>
        {% if back %}<a href="{{ back }}" class="admin-btn admin-btn--muted">Cancel</a>{% endif %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
