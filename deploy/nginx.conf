# /etc/nginx/sites-available/safariops — TLS via certbot (certbot --nginx -d ops.example.com)
server {
    listen 80;
    server_name ops.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ops.example.com;
    # ssl_certificate / ssl_certificate_key are added by certbot

    client_max_body_size 20m;

    # Supplier contracts etc. are private: only the staff-only Django view may serve them.
    location /media/private/ { deny all; return 404; }
    location /media/ { alias /var/www/safariops/media/; expires 7d; add_header X-Content-Type-Options nosniff; }
    # Static files are served by WhiteNoise from STATIC_ROOT; nginx may also serve them directly:
    location /static/ { alias /var/www/safariops/staticfiles/; expires 30d; access_log off; }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
